name: YoureFlocked
options:
  bundleIdPrefix: io.vws.app.flckd
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Local.xcconfig is gitignored; generation must still work before it exists.
  disabledValidations:
    - missingConfigFiles

# Per-developer signing settings (DEVELOPMENT_TEAM). Copy Example.xcconfig to
# Local.xcconfig and fill it in. Nothing tracked names a team.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    INFOPLIST_FILE: YoureFlocked/Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    # The app and extension must sign with the same identity, or the device
    # install fails with "Embedded binary is not signed with the same certificate".
    # XcodeGen's preset applies the legacy "iPhone Developer" to the app only.
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_PREVIEWS: YES

targets:
  YoureFlocked:
    type: application
    platform: iOS
    sources:
      - path: YoureFlocked
      - path: Shared
    resources:
      - path: YoureFlocked/Resources
    dependencies:
      - target: YoureFlockedWidgets
      - package: ValhallaMobile
        product: Valhalla
      - package: Ferrostar
        product: FerrostarCore
      - package: Ferrostar
        product: FerrostarSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vws.app.flckd
        CODE_SIGN_IDENTITY: "Apple Development"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: YoureFlocked/Resources/YoureFlocked.entitlements
    postBuildScripts:
      # The routing latency HUD, reroute probe and metrics store are wrapped
      # in #if DEBUG, so a Release build should not contain them. Verify the
      # artefact rather than trusting that the source is still gated: a stray
      # edit to a conditional would otherwise ship silently.
      # OWASP MASTG-TEST-0084.
      - name: Assert no diagnostics in release builds
        basedOnDependencyAnalysis: false
        script: |
          [ "$CONFIGURATION" = "Debug" ] && exit 0
          BINARY="$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
          [ -f "$BINARY" ] || exit 0
          if strings -a "$BINARY" | grep -q 'FLCKD_DIAGNOSTICS_PRESENT_DO_NOT_SHIP'; then
            echo "error: diagnostics are compiled into this $CONFIGURATION build. They are #if DEBUG for a reason; do not ship this archive."
            exit 1
          fi

  YoureFlockedWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: YoureFlockedWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vws.app.flckd.widgets
        CODE_SIGN_IDENTITY: "Apple Development"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: YoureFlockedWidgets/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES

  YoureFlockedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YoureFlockedTests
    dependencies:
      - target: YoureFlocked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vws.app.flckd.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "Apple Development"

  YoureFlockedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YoureFlockedUITests
    dependencies:
      - target: YoureFlocked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vws.app.flckd.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: YoureFlocked
        CODE_SIGN_IDENTITY: "Apple Development"

packages:
  # Pinned exactly: 0.6.4 moves the embedded engine from Valhalla 3.6.3 to
  # 3.9.1, and tiles are memory-mapped, so the builder and the engine have to
  # stay on the same version. `from:` let a fresh checkout resolve 0.6.4.
  ValhallaMobile:
    url: https://github.com/rallista/valhalla-mobile.git
    exactVersion: 0.6.3
  # Pinned exactly: the maintainers don't audit the Swift API for breaks
  # between releases, and only FerrostarCore and FerrostarSwiftUI are linked
  # so MapLibre stays out of the binary.
  Ferrostar:
    url: https://github.com/stadiamaps/ferrostar.git
    exactVersion: 0.59.0

schemes:
  YoureFlocked:
    build:
      targets:
        YoureFlocked: all
    run:
      config: Debug
      simulateLocation:
        allow: true
    test:
      config: Debug
      targets:
        - YoureFlockedTests
        - YoureFlockedUITests
    profile:
      config: Release
    analyze:
      config: Debug
