name: YoureFlocked
options:
  bundleIdPrefix: io.vws.app.flckd
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Local.xcconfig is gitignored; generation must still work before it exists.
  disabledValidations:
    - missingConfigFiles

# Per-developer signing settings (DEVELOPMENT_TEAM). Copy Example.xcconfig to
# Local.xcconfig and fill it in. Nothing tracked names a team.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    INFOPLIST_FILE: YoureFlocked/Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    # The app and extension must sign with the same identity, or the device
    # install fails with "Embedded binary is not signed with the same certificate".
    # XcodeGen's preset applies the legacy "iPhone Developer" to the app only.
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_PREVIEWS: YES

targets:
  YoureFlocked:
    type: application
    platform: iOS
    sources:
      - path: YoureFlocked
      - path: Shared
    resources:
      - path: YoureFlocked/Resources
    dependencies:
      - target: YoureFlockedWidgets
      - package: ValhallaMobile
        product: Valhalla
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vws.app.flckd
        CODE_SIGN_IDENTITY: "Apple Development"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: YoureFlocked/Resources/YoureFlocked.entitlements

  YoureFlockedWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: YoureFlockedWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vws.app.flckd.widgets
        CODE_SIGN_IDENTITY: "Apple Development"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: YoureFlockedWidgets/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES

  YoureFlockedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YoureFlockedUITests
    dependencies:
      - target: YoureFlocked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vws.app.flckd.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: YoureFlocked
        CODE_SIGN_IDENTITY: "Apple Development"

packages:
  ValhallaMobile:
    url: https://github.com/rallista/valhalla-mobile.git
    from: 0.6.3

schemes:
  YoureFlocked:
    build:
      targets:
        YoureFlocked: all
    run:
      config: Debug
      simulateLocation:
        allow: true
    test:
      config: Debug
      targets:
        - YoureFlockedUITests
    profile:
      config: Release
    analyze:
      config: Debug
