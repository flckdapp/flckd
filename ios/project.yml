name: YoureFlocked
options:
  bundleIdPrefix: io.vws.app.flckd
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Local.xcconfig is gitignored; generation must still work before it exists.
  disabledValidations:
    - missingConfigFiles

# Per-developer signing settings (DEVELOPMENT_TEAM). Copy Example.xcconfig to
# Local.xcconfig and fill it in. Nothing tracked names a team.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    INFOPLIST_FILE: YoureFlocked/Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    # The app and extension must sign with the same identity, or the device
    # install fails with "Embedded binary is not signed with the same certificate".
    # XcodeGen's preset applies the legacy "iPhone Developer" to the app only.
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_PREVIEWS: YES
    # PhononCore supplies Apple-silicon simulator slices only.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  YoureFlocked:
    type: application
    platform: iOS
    sources:
      - path: YoureFlocked
        excludes:
          - Resources/VoicePrompts
      - path: Shared
      - path: YoureFlocked/Resources/VoicePrompts
        type: folder
        buildPhase: resources
    dependencies:
      - target: YoureFlockedWidgets
      - package: ValhallaMobile
        product: Valhalla
      - package: Ferrostar
        product: FerrostarCore
      - package: Phonon
        product: ptts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vws.app.flckd
        CODE_SIGN_IDENTITY: "Apple Development"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: YoureFlocked/Resources/YoureFlocked.entitlements
    postBuildScripts:
      - name: Bundle offline Phonon models
        basedOnDependencyAnalysis: false
        script: |
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Models"
          rm -rf "$DEST"
          rm -f "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/phonon-road-names.json"
          SOURCE="$SRCROOT/_phonon/Models"
          if [ ! -f "$SOURCE/bundle.json" ]; then
            echo "error: run scripts/voice-model/fetch_phonon.py with uv before building or archiving."
            exit 1
          fi
          ditto "$SOURCE" "$DEST"
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          cp "$SRCROOT/YoureFlockedTests/Navigation/Fixtures/spoken-road-names.json" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/phonon-road-names.json"
      # The routing latency HUD, reroute probe and metrics store are wrapped
      # in #if DEBUG, so a Release build should not contain them. Verify the
      # artefact rather than trusting that the source is still gated: a stray
      # edit to a conditional would otherwise ship silently.
      # OWASP MASTG-TEST-0084.
      - name: Assert no diagnostics in release builds
        basedOnDependencyAnalysis: false
        script: |
          [ "$CONFIGURATION" = "Debug" ] && exit 0
          BINARY="$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
          [ -f "$BINARY" ] || exit 0
          if strings -a "$BINARY" | grep -q 'FLCKD_DIAGNOSTICS_PRESENT_DO_NOT_SHIP'; then
            echo "error: diagnostics are compiled into this $CONFIGURATION build. They are #if DEBUG for a reason; do not ship this archive."
            exit 1
          fi

  YoureFlockedWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: YoureFlockedWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vws.app.flckd.widgets
        CODE_SIGN_IDENTITY: "Apple Development"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: YoureFlockedWidgets/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES

  YoureFlockedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YoureFlockedTests
    dependencies:
      - target: YoureFlocked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vws.app.flckd.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "Apple Development"

  YoureFlockedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YoureFlockedUITests
    dependencies:
      - target: YoureFlocked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vws.app.flckd.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: YoureFlocked
        CODE_SIGN_IDENTITY: "Apple Development"

packages:
  # Pinned exactly: the bundled models and Swift API match this runtime.
  # The model is bundled for offline speech in every configuration.
  Phonon:
    url: https://github.com/gradium-ai/xn-ptts.git
    exactVersion: 0.7.1
  # Pinned exactly: 0.6.4 moves the embedded engine from Valhalla 3.6.3 to
  # 3.9.1, and tiles are memory-mapped, so the builder and the engine have to
  # stay on the same version. `from:` let a fresh checkout resolve 0.6.4.
  ValhallaMobile:
    url: https://github.com/rallista/valhalla-mobile.git
    exactVersion: 0.6.3
  # Pinned exactly: the maintainers don't audit the Swift API for breaks
  # between releases. Only FerrostarCore is linked: the app draws its own
  # driving screen with MapKit, so MapLibre and Ferrostar's views stay out of
  # the binary.
  Ferrostar:
    url: https://github.com/stadiamaps/ferrostar.git
    exactVersion: 0.59.0

schemes:
  YoureFlocked:
    build:
      targets:
        YoureFlocked: all
    run:
      config: Debug
      simulateLocation:
        allow: true
    test:
      config: Debug
      environmentVariables:
        FLCKD_TEST_DISABLE_ACTIVITY_REQUESTS: "1"
      targets:
        - YoureFlockedTests
        - YoureFlockedUITests
    profile:
      config: Release
    analyze:
      config: Debug
