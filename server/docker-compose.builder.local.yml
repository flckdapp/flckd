# Local testing only. The real deployment is docker-compose.builder.yml.
#
# Paths are relative to this directory and the container runs as the invoking
# user, so files it writes are not root-owned.
#
#   # build one state
#   docker compose -f docker-compose.builder.local.yml run --rm builder \
#     -c 'PBF_URL=https://download.geofabrik.de/north-america/us/oklahoma-latest.osm.pbf \
#        PBF_NAME=oklahoma-latest.osm.pbf run-build.sh oklahoma'
#
#   # then serve what you built
#   FLCKD_DOCROOT=./_local/tiles docker compose -f origin/docker-compose.local.yml up
#
# Disk: budget about 20x the source map file. Oklahoma (~170 MB) needs ~4 GB.

name: flckd-tile-builder-local

services:
  builder:
    build:
      context: ./builder
    image: flckd/tile-builder:3.6.3

    restart: "no"

    # Run as the invoking user so the output is not root-owned.
    user: "${UID:-1000}:${GID:-1000}"

    env_file:
      - path: ./.env.r2
        required: false

    environment:
      DATA_DIR: /data
      DOCROOT: /srv/tiles
      # Lower this if the build is killed. Concurrency is the memory dial:
      # roughly 1.55 GB per thread plus 1.5 GB.
      THREADS: "${THREADS:-4}"
      KEEP_RELEASES: "3"
      PART_BYTES: "134217728"

    volumes:
      - ./_local/build:/data        # source map, scratch, national graph
      - ./_local/tiles:/srv/tiles   # published output
      - ./origin/www:/srv/www:ro    # static dashboard assets

    # Needs outbound HTTPS: Geofabrik for the map data, and github.com for the
    # timezone boundaries that the Valhalla build downloads at run time.
    network_mode: bridge

    command: ["run-build.sh"]
