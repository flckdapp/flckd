# FLCKD tile builder: one-shot monthly job.
#
# This is not a long-running service. It builds a release and exits. Run it
# from the shell, or from cron on the first of the month:
#
#   FLCKD_DATA=/srv/flckd docker compose -f docker-compose.builder.yml run --rm builder run-build.sh
#
# It writes into the same data directory the origin serves read-only:
#   $FLCKD_DATA/build   source PBF, scratch, national graph
#   $FLCKD_DATA/tiles   published docroot
#   $FLCKD_DATA/www     dashboard assets, read-only
#
# Disk for a full-US build:
#   source PBF                ~12 GB
#   peak scratch (.bin files) ~220 GB   (the binding constraint, ~20x the PBF)
#   national tile dir + tar   ~24-36 GB
#   published docroot         ~15-20 GB per retained release
# Budget ~400 GB free under $FLCKD_DATA.

name: flckd-tile-builder

services:
  builder:
    image: ghcr.io/flckdapp/flckd/builder:3.6.3
    pull_policy: always
    container_name: flckd-tile-builder

    # Not "unless-stopped": this is a job, and it must not restart on exit.
    restart: "no"

    # Must match the origin's uid so both can use the same data directory.
    user: "568:568"

    environment:
      DATA_DIR: /data
      DOCROOT: /srv/tiles
      # Peak RAM is ~1.55 GB per thread + 1.5 GB. On a 128 GB box, 16 threads
      # is ~26 GB and comfortable. Lower this first if anything is OOM-killed:
      # concurrency is the memory dial, not region size.
      THREADS: "16"
      KEEP_RELEASES: "3"
      PART_BYTES: "134217728"
      # --- R2 front door. Unset these to serve from the local nginx origin
      #     only. Use an env file or a Docker secret, not literals here.
      # R2_ACCOUNT_ID: ""
      # R2_BUCKET: "flckd-tiles"
      # R2_ACCESS_KEY_ID: ""
      # R2_SECRET_ACCESS_KEY: ""
      #
      # --- purge the pointer after publishing (needs a "Cache Purge" token)
      # PUBLIC_BASE_URL: "https://tiles.flckd.app"
      # CF_ZONE_ID: ""
      # CF_API_TOKEN: ""

    volumes:
      - ${FLCKD_DATA:-/srv/flckd}/build:/data          # PBF + scratch + national graph
      - ${FLCKD_DATA:-/srv/flckd}/tiles:/srv/tiles     # published docroot (rw here)
      - ${FLCKD_DATA:-/srv/flckd}/www:/srv/www:ro      # static dashboard assets

    # Needs outbound HTTPS: Geofabrik for the PBF and diffs, and github.com for
    # the timezone shapefile that valhalla_build_timezones downloads at run time.
    network_mode: bridge

    command: ["run-build.sh"]

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
