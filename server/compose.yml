name: flckd-server
services:
  server:
    build: .
    image: flckd-server:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FLCKD_CONTROL_PORT:-8642}:8642"
      - "${FLCKD_TILE_BIND:-0.0.0.0}:${FLCKD_TILE_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      BUILDER_ENABLED: ${BUILDER_ENABLED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_PROVIDER: ${S3_PROVIDER:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      BUILDER_ALLOWED_HOSTS: ${BUILDER_ALLOWED_HOSTS:-}
      BUILD_REGIONS: ${BUILD_REGIONS:-}
      BUILD_CADENCE: ${BUILD_CADENCE:-}
      THREADS: ${THREADS:-}
      PBF_URL: ${PBF_URL:-}
      PBF_NAME: ${PBF_NAME:-}
    volumes:
      - data:/data
      - site:/site
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8080/health && { [ \"$$BUILDER_ENABLED\" = false ] || curl -fsS http://127.0.0.1:8642/health; }"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  data:
  site:
