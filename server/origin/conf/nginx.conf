# ---------------------------------------------------------------------------
# FLCKD tile distribution origin.
#
# Role: origin behind Cloudflare, serving large immutable files.
# Image: nginx:1.30.4-alpine (pinned by digest in docker-compose.yml).
#
# Runs as uid 568 with read_only:true and cap_drop:ALL.
# ---------------------------------------------------------------------------

# No "user" directive on purpose. The container already runs as a non-root UID
# via compose. Setting it here only logs:
#   [warn] the "user" directive makes sense only if the master process runs
#   with super-user privileges, ignored
worker_processes      auto;
worker_rlimit_nofile  65535;
pid                   /var/run/nginx.pid;

# Level is "crit" on purpose.
#
# At "warn" or "error", nginx logs a line per failed request (for example
# "open() ... failed (2: No such file or directory)" for any 404), and those
# lines contain the client address. That would reintroduce request logging
# through the back door.
#
# "crit" keeps startup failures, worker crashes and resource exhaustion, and
# emits nothing per request.
# [emerg] configuration errors are always printed regardless of this setting.
error_log /dev/stderr crit;

# Our own pool, so tile reads cannot starve anything added later.
# Default would be "default threads=32 max_queue=65536".
thread_pool tiles threads=32 max_queue=65536;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # -----------------------------------------------------------------------
    # No request logging. This is a hard requirement.
    #
    # The app exists to keep people out of surveillance databases, so its own
    # infrastructure must not build one. A log of which region pack an address
    # downloaded, and when, is a location record. The only way to guarantee it
    # is never leaked, subpoenaed, or breached is to never create it.
    #
    # Stripping $remote_addr from a log format is not sufficient: timing, byte
    # counts and request order still correlate across entries. So the access
    # log is off entirely rather than anonymised.
    #
    # What an operator still gets:
    #   /health          liveness
    #   /nginx_status    live connection counts, LAN only
    #   error_log crit   startup and worker failures only
    #   builder logs     tile generation errors, which involve no user requests
    #
    # Self-hosters who want request logs on their own instance can uncomment
    # the block below. Do not enable it on an instance other people rely on
    # without saying so in the privacy policy.
    #
    #   log_format ops escape=json
    #       '{"ts":"$time_iso8601","uri":"$uri","status":$status,'
    #       '"bytes":$body_bytes_sent,"req_time":$request_time}';
    #   access_log /dev/stdout ops;
    #
    # (Even that reduced format omits $remote_addr, $http_x_forwarded_for and
    #  $http_cf_connecting_ip. Keep it that way.)
    # -----------------------------------------------------------------------
    access_log off;

    # -----------------------------------------------------------------------
    # Large file I/O
    #
    # sendfile on + aio threads: zero-copy send, offloaded to a thread pool,
    # page cache / ZFS ARC still used.
    #
    # directio must stay off. It sets O_DIRECT, which:
    #   - disables sendfile for the request (nginx docs), and therefore makes
    #     tcp_nopush a no-op too;
    #   - bypasses the cache, so one disk read becomes N reads for N clients
    #     of the same pack;
    #   - makes unaligned range reads blocking.
    # `aio on` (as opposed to `aio threads`) requires directio on Linux, so it
    # is also wrong here.
    # -----------------------------------------------------------------------
    sendfile            on;
    sendfile_max_chunk  2m;      # already the default since 1.21.4; explicit
    tcp_nopush          on;
    tcp_nodelay         on;
    aio                 threads=tiles;
    directio            off;
    output_buffers      2 256k;

    # Content is immutable and content-addressed, so cached fds stay valid.
    open_file_cache          max=4096 inactive=600s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors   on;

    keepalive_timeout      65s;
    keepalive_requests     1000;
    send_timeout           300s;   # sends are long; do not cut them short
    client_header_timeout  15s;
    client_body_timeout    15s;
    client_max_body_size   1m;     # nothing is ever uploaded here
    reset_timedout_connection on;

    # -----------------------------------------------------------------------
    # Validators
    #
    # Keep nginx's built-in ETag. Its format is "hex(mtime)-hex(size)" and the
    # body is never hashed, so publish.py stamps every immutable file with a
    # fixed mtime to keep ETags stable across rebuilds and across machines.
    #
    # Do not replace it with `etag off; add_header ETag "sha256-..."`. nginx's
    # If-None-Match handler reads an internal etag pointer that add_header
    # never sets, so a hand-rolled ETag silently makes every revalidation
    # return the full body instead of 304. If-Range breaks the same way.
    # -----------------------------------------------------------------------
    etag               on;
    if_modified_since  exact;

    # Exactly one range per request is what a resuming download needs.
    # Do not use `max_ranges 0`: that returns before the code that adds the
    # Accept-Ranges header, so the header disappears and resume breaks.
    max_ranges  1;

    # gzip on a binary is harmful here: the gzip header filter calls
    # ngx_http_clear_accept_ranges(), which sets allow_ranges = 0. That kills
    # range requests and weakens the ETag. Enabled per-location for JSON only,
    # where ranges are irrelevant.
    gzip       off;
    autoindex  off;

    absolute_redirect off;
    port_in_redirect  off;

    server {
        listen      8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /srv/tiles;

        # Anything not matched below is a 404.
        location / {
            return 404 '{"error":"not_found"}';
        }

        # -------------------------------------------------------------------
        # 0. Landing page, the only human-facing page.
        #
        #    Served from /srv/www (a separate read-only mount), not from the
        #    tile docroot, so the publish pipeline never touches it.
        #
        #    The page is static; it fetches /v1/manifest.json client-side to
        #    show which states are available and when they were last updated.
        # -------------------------------------------------------------------
        location = /logo.png {
            root       /srv/www;
            types      { image/png png; }
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files  $uri =404;
        }

        location = / {
            root         /srv/www;
            default_type text/html;

            # No gzip_types needed: text/html is always compressed when
            # gzip is on (nginx warns "duplicate MIME type" if listed).
            gzip             on;
            gzip_min_length  256;
            gzip_vary        on;

            add_header Cache-Control "public, max-age=300" always;
            add_header X-Content-Type-Options "nosniff" always;

            try_files /index.html =404;
        }

        # -------------------------------------------------------------------
        # 1. Pack parts: immutable, content-addressed, the only large objects
        #
        #    /v1/packs/<sha256>/part-0000.tar
        #
        #    The sha256 in the path is the cache key. Content that does not
        #    change keeps its URL and stays in the Cloudflare cache across
        #    rebuilds; content that changes gets a new URL. Nothing here is
        #    ever overwritten, so nothing here ever needs purging.
        #
        #    stale-if-error lets Cloudflare keep serving these for 30 days
        #    after this box goes offline. There is deliberately no s-maxage
        #    and no must-revalidate: per RFC 9111 either one implies
        #    proxy-revalidate, and Cloudflare then refuses to serve stale at
        #    all, which would silently defeat the offline-origin requirement.
        # -------------------------------------------------------------------
        location /v1/packs/ {
            autoindex off;
            gzip      off;
            max_ranges 1;
            aio       threads=tiles;
            directio  off;
            sendfile  on;
            sendfile_max_chunk 2m;

            # add_header does not inherit from an outer level once any
            # add_header exists at this level, so every header is repeated in
            # full in every location.
            #
            # Do not add "Accept-Ranges: bytes" here: the range filter already
            # emits it and add_header would produce a duplicate.
            add_header Cache-Control "public, max-age=31536000, immutable, stale-if-error=2592000" always;
            add_header X-Content-Type-Options "nosniff" always;

            types { application/octet-stream tar; }

            try_files $uri =404;
        }

        # -------------------------------------------------------------------
        # 2. Per-release manifests: immutable, small
        # -------------------------------------------------------------------
        location /v1/releases/ {
            autoindex off;
            default_type application/json;

            gzip             on;
            gzip_types       application/json;
            gzip_min_length  256;
            gzip_vary        on;

            add_header Cache-Control "public, max-age=31536000, immutable, stale-if-error=2592000" always;
            add_header X-Content-Type-Options "nosniff" always;

            try_files $uri =404;
        }

        # -------------------------------------------------------------------
        # 3. The pointer: the only mutable URL in the tree
        #
        #    Short TTL so a new release is picked up quickly, plus a long
        #    stale-if-error so clients keep resolving packs while this box is
        #    off. This is the single URL to purge after publishing.
        # -------------------------------------------------------------------
        location = /v1/manifest.json {
            default_type application/json;

            gzip             on;
            gzip_types       application/json;
            gzip_min_length  256;
            gzip_vary        on;

            add_header Cache-Control "public, max-age=60, stale-while-revalidate=600, stale-if-error=2592000" always;
            add_header X-Content-Type-Options "nosniff" always;

            try_files $uri =404;
        }

        # -------------------------------------------------------------------
        # 4. Build status: operator visibility, never cached
        # -------------------------------------------------------------------
        location = /v1/build-status.json {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # -------------------------------------------------------------------
        # 5. Health: no disk access
        # -------------------------------------------------------------------
        location = /health {
            access_log   off;
            default_type application/json;
            add_header   Cache-Control "no-store" always;
            return 200 '{"status":"ok"}';
        }

        # -------------------------------------------------------------------
        # 6. stub_status: LAN only.
        #
        #    realip is deliberately not enabled, so every proxied request
        #    appears to come from a Cloudflare address. This allow/deny is
        #    therefore only meaningful for direct LAN traffic: do not route
        #    /nginx_status through Cloudflare.
        # -------------------------------------------------------------------
        location = /nginx_status {
            stub_status;
            access_log off;
            add_header Cache-Control "no-store" always;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
        }

        # 403 and 404 are made indistinguishable so paths cannot be probed.
        error_page 403 404 = @notfound;
        error_page 500 502 503 504 = @servererror;

        location @notfound {
            internal;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 404 '{"error":"not_found"}';
        }

        location @servererror {
            internal;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"error":"unavailable"}';
        }
    }
}
